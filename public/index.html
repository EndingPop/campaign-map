<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Campaign map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-18 -18 36 36'%3E%3Ccircle r='15' fill='%23c9a227' stroke='%231f2a36' stroke-width='4'/%3E%3Cpath d='M0,-8 L2.5,-2.5 L8,0 L2.5,2.5 L0,8 L-2.5,2.5 L-8,0 L-2.5,-2.5Z' fill='%231f2a36'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Shown while starting up, and for sign-in, non-members and setup errors. -->
  <main id="gate" class="gate">
    <div class="gate-card">
      <h1 class="site-title">Campaign Map</h1>
      <p id="gate-message" class="gate-message">Loading…</p>
      <div id="gate-actions" class="gate-actions"></div>
    </div>
  </main>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="toggle-side" class="icon-btn" type="button" aria-controls="side" aria-expanded="true" title="Show or hide the legend and route">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="title site-title">Campaign Map</h1>
      <button id="party-jump" class="party-chip" type="button" title="Center the map on the party">
        <span class="party-dot" aria-hidden="true"></span>
        <span id="party-label">Party position not set</span>
      </button>
      <span class="spacer"></span>
      <button id="present-chip" class="status-chip-btn presenting" type="button" title="Your view is shown on screens following you. Click to stop presenting." hidden>Presenting</button>
      <button id="follow-chip" class="status-chip-btn" type="button" title="This window follows what the DM shows. Click to stop following." hidden>Following DM</button>
      <button id="pc-view-badge" class="pc-view-badge" type="button" title="This window shows only what players see. Click to leave PC view." hidden>PC view</button>
      <span id="env-badge" class="env-badge" hidden></span>
      <div class="menu">
        <button id="user-button" class="user-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="user-name"></span><span id="user-role" class="role"></span>
        </button>
        <div id="user-menu" class="menu-list" role="menu" hidden></div>
      </div>
    </header>

    <aside id="side" class="side">
      <section class="side-section search-section">
        <h2>Search</h2>
        <div class="search-box">
          <input id="search-input" class="search-input" type="search" placeholder="Places, NPCs, notes, stops" autocomplete="off"
            aria-label="Search pins, NPCs, notes and route stops" aria-controls="search-results">
          <button id="search-clear" class="search-clear" type="button" title="Clear search" aria-label="Clear search" hidden>
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="search-scope" class="search-scope"></div>
        <p id="search-status" class="search-status" aria-live="polite" hidden></p>
        <ol id="search-results" class="search-results" hidden></ol>
      </section>
      <div id="side-tabs" class="side-tabs" role="tablist" aria-label="Side panel">
        <button type="button" role="tab" data-tab="map" aria-controls="map-pane" aria-selected="true">Map and route</button>
        <button type="button" role="tab" data-tab="npcs" aria-controls="npc-pane" aria-selected="false">NPCs <span id="npc-tab-count" class="tab-count"></span></button>
        <button type="button" role="tab" data-tab="sessions" aria-controls="session-pane" aria-selected="false">Sessions <span id="session-tab-count" class="tab-count"></span></button>
      </div>
      <div id="map-pane" role="tabpanel">
        <section class="side-section">
          <h2>Show on map</h2>
          <div id="filters"></div>
        </section>
        <section class="side-section">
          <h2>Route</h2>
          <p id="route-summary" class="route-summary" hidden></p>
          <ol id="route-list" class="route-list" reversed></ol>
        </section>
        <section class="side-section">
          <h2>Planned routes</h2>
          <ul id="plan-list" class="route-list plan-list"></ul>
          <button id="plan-btn" class="btn small" type="button">Plan a route</button>
        </section>
      </div>
      <section id="npc-pane" class="side-section npc-pane" role="tabpanel" hidden></section>
      <section id="session-pane" class="side-section npc-pane" role="tabpanel" hidden></section>
    </aside>

    <div id="map" class="map" aria-label="Campaign map"></div>

    <aside id="detail" class="detail" hidden aria-live="polite"></aside>

    <nav id="dm-tools" class="dm-tools" hidden aria-label="DM tools">
      <button type="button" data-mode="select" aria-pressed="true">Select</button>
      <button type="button" data-mode="addPin" aria-pressed="false">Add pin</button>
      <button type="button" data-mode="addStop" aria-pressed="false">Add stop</button>
      <button type="button" data-mode="move" aria-pressed="false">Move pins</button>
      <button id="present-btn" type="button" class="pc-view-btn" aria-pressed="false" title="Send what this window shows to PC view windows (and players following you)">Present</button>
      <button id="pc-view-btn" type="button" title="Switch this window to what players see, for projecting at the table">PC view</button>
    </nav>
    <div id="mode-hint" class="mode-hint" role="status" hidden></div>
    <div id="viewer" class="viewer" hidden></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
